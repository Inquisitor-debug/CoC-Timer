name: Build CoC Timer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          curl -fL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o "$RUNNER_TEMP/tools.zip"
          mkdir -p "$RUNNER_TEMP/tools"
          unzip -q "$RUNNER_TEMP/tools.zip" -d "$RUNNER_TEMP/tools"
          mv "$RUNNER_TEMP/tools/cmdline-tools" "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          set -e
          unzip -o CoCWidget-Android-Source.zip -d extracted
          test -f extracted/cocwidget/settings.gradle.kts
          test -f extracted/cocwidget/app/build.gradle.kts

      - name: Build APK
        shell: bash
        run: |
          set -e
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          cd extracted/cocwidget
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoC-Timer-APK
          path: extracted/cocwidget/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
